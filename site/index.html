<div class="wrap">

<script>
(function(){
'use strict';
const TZ='America/Los_Angeles', SICK_CAP=80, SICK_USE_CAP=48, VAC_PER_YEAR=40;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view=$('#view'), layer=$('#layer');

if(!window.supabase||SUPABASE_URL.startsWith('PASTE')){
  view.innerHTML='<div class="panel"><h2>Almost there</h2><p class="sub" style="margin:0">Open <b>index.html</b> in a text editor and paste your Supabase project URL and anon key at the top, where it says SETTINGS. Then upload it again.</p></div>';
  return;
}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ---------- time helpers (always clinic time) ---------- */
const partsFmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function laParts(d){const o={};partsFmt.formatToParts(d).forEach(p=>o[p.type]=p.value);return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24,mi:+o.minute}}
const pad=n=>String(n).padStart(2,'0');
function laDate(d){const p=laParts(d);return p.y+'-'+pad(p.m)+'-'+pad(p.d)}
function laHM(ts){if(!ts)return '';const p=laParts(new Date(ts));return pad(p.h)+':'+pad(p.mi)}
function laToISO(date,hm){if(!hm)return null;const[y,m,d]=date.split('-').map(Number),[h,mi]=hm.split(':').map(Number);const want=Date.UTC(y,m-1,d,h,mi);let t=want;
  for(let i=0;i<3;i++){const p=laParts(new Date(t));t+=want-Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)}return new Date(t).toISOString()}
function fmtT(ts){if(!ts)return '—';const p=laParts(new Date(ts));const h=p.h%12||12;return h+':'+pad(p.mi)+(p.h>=12?'p':'a')}
function fmtBig(ms){const p=laParts(new Date(ms));return (p.h%12||12)+':'+pad(p.mi)+' '+(p.h>=12?'PM':'AM')}
const mins=(a,b)=>Math.round((new Date(b)-new Date(a))/60000);
const hrs=m=>(m/60).toFixed(2);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dlabel=iso=>new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);

/* ---------- toast ---------- */
let tt;function toast(msg,err){clearTimeout(tt);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.className='toast'+(err?' err':'');el.textContent=msg;el.hidden=false;tt=setTimeout(()=>el.hidden=true,err?5000:2800)}
const errMsg=e=>(e&&(e.message||e.error_description))||String(e);

/* ---------- California rules ---------- */
function restNeeded(w){if(w<210)return 0;return Math.floor(w/240)+(w%240>120?1:0)}
function mealsOf(sh){return [[sh.meal1_start,sh.meal1_end],[sh.meal2_start,sh.meal2_end]].filter(m=>m[0]&&m[1])}
function evaluate(sh,waiverOnFile){
  const R={worked:null,mealPrem:0,restPrem:0,flags:[],sev:'ok'};
  if(!sh.clock_out){R.flags.push({c:'yellow',t:'Missing clock-out'});R.sev='yellow';return R}
  const meals=mealsOf(sh), mealMin=meals.reduce((a,m)=>a+mins(m[0],m[1]),0);
  const w=mins(sh.clock_in,sh.clock_out)-mealMin;R.worked=w;
  const why=[];
  if(w>300){
    if(!meals.length){if(!(sh.meal_answer==='waived'&&w<=360&&waiverOnFile))why.push(sh.meal_answer!=='waived'?'No lunch recorded':w>360?'Lunch skipped on a shift over 6 hours (can\u2019t be waived)':'Lunch skipped without a signed waiver on file')}
    else{const d=mins(meals[0][0],meals[0][1]);if(d<30)why.push('Short lunch ('+d+' min)');if(mins(sh.clock_in,meals[0][0])>300)why.push('Late lunch (started after 5th hour)')}
    if(w>600){
      if(meals.length<2){if(!(w<=720&&meals.length===1&&waiverOnFile&&sh.meal_answer!=='no'))why.push('No second lunch (over 10 hrs)')}
      else{const m2=mins(meals[1][0],meals[1][1]);if(m2<30)why.push('Short second lunch ('+m2+' min)');if(mins(sh.clock_in,meals[1][0])-mins(meals[0][0],meals[0][1])>600)why.push('Second lunch started after 10th hour')}
    }
    if(sh.meal_answer==='no'&&!why.length)why.push('Staff reported no full lunch');
  }
  if(why.length){R.mealPrem=1;R.flags.push({c:'red',t:'Meal premium',why:why.join(' · ')})}
  const rn=restNeeded(w);
  if(rn>0&&sh.rest_answer==='no'){R.restPrem=1;R.flags.push({c:'orange',t:'Rest premium',why:'Staff reported missing a 10-min break ('+rn+' required)'})}
  if((w>300&&!sh.meal_answer)||(rn>0&&!sh.rest_answer))R.flags.push({c:'yellow',t:'Break questions unanswered'});
  if(sh.times_accurate===false&&!sh.edited)R.flags.push({c:'yellow',t:'Staff says times are wrong',why:'See messages from staff'});
  if(sh.edited)R.flags.push({c:'yellow',t:'Edited',why:'See change log'});
  if(sh.meal_answer==='waived'&&!R.mealPrem&&w>300)R.flags.push({c:'ok',t:'Lunch waived (6 hrs or less)'});
  if(meals.some(m=>mins(m[0],m[1])>60))R.flags.push({c:'yellow',t:'Lunch over 1 hour',why:'Ask payroll whether a split-shift premium applies'});
  R.sev=R.flags.some(f=>f.c==='red')?'red':R.flags.some(f=>f.c==='orange')?'orange':R.flags.some(f=>f.c==='yellow')?'yellow':'ok';
  return R;
}

/* ---------- overtime: daily (8/12), weekly (40) and 7th consecutive day ---------- */
const dowOf=iso=>new Date(iso+'T12:00:00Z').getUTCDay();
const weekOf=iso=>addDays(iso,-((dowOf(iso)-WORKWEEK_START_DAY+7)%7));
function payBreakdown(empShifts){
  const days={};
  empShifts.forEach(s=>{const R=evaluate(s);if(R.worked!=null)days[s.work_date]=(days[s.work_date]||0)+R.worked});
  const weeks={};Object.keys(days).sort().forEach(d=>{(weeks[weekOf(d)]=weeks[weekOf(d)]||[]).push(d)});
  const out={};
  Object.entries(weeks).forEach(([wk,ds])=>{
    const allSeven=ds.filter(d=>days[d]>0).length===7;let weekReg=0;
    ds.forEach(d=>{const m=days[d];let reg,ot,dt;
      if(allSeven&&d===addDays(wk,6)){reg=0;ot=Math.min(m,480);dt=Math.max(0,m-480)}
      else{reg=Math.min(m,480);ot=Math.max(0,Math.min(m,720)-480);dt=Math.max(0,m-720)}
      if(weekReg+reg>2400){const ex=weekReg+reg-2400;reg-=ex;ot+=ex}
      weekReg+=reg;out[d]={worked:m,reg,ot,dt,seventh:allSeven&&d===addDays(wk,6)}});
  });
  return out;
}
function splitFlags(empShifts){
  const by={},out={};empShifts.filter(s=>s.clock_out).forEach(s=>{const k=s.employee_id+'|'+s.work_date;(by[k]=by[k]||[]).push(s)});
  Object.values(by).forEach(list=>{list.sort((a,b)=>a.clock_in.localeCompare(b.clock_in));
    for(let i=1;i<list.length;i++)if(mins(list[i-1].clock_out,list[i].clock_in)>60)out[list[i].id]=true});
  return out;
}

/* ---------- mode switching ---------- */
let mode=location.hash==='#manager'?'manager':'staff';
$('#switchMode').onclick=()=>{mode=mode==='staff'?'manager':'staff';location.hash=mode==='manager'?'manager':'';start()};
window.addEventListener('hashchange',()=>{const m=location.hash==='#manager'?'manager':'staff';if(m!==mode){mode=m;start()}});
function start(){layer.innerHTML='';$('#mtabs').hidden=true;
  $('#modeLabel').textContent=mode==='staff'?'Clock in and out':'Manager';
  $('#switchMode').textContent=mode==='staff'?'Manager login':'Back to staff clock';
  mode==='staff'?staffStart():mgrStart()}

/* =============================== STAFF =============================== */
const ST={list:[],emp:null,pin:null,status:null,skew:0,idle:null,tick:null};
function remember(id){try{id?localStorage.setItem('hl-emp',id):localStorage.removeItem('hl-emp')}catch(e){}}
function remembered(){try{return localStorage.getItem('hl-emp')}catch(e){return null}}
const serverNow=()=>Date.now()+ST.skew;
async function staffStart(){
  clearInterval(ST.tick);ST.pin=null;ST.status=null;
  view.innerHTML='<p class="loading">Loading…</p>';
  const {data,error}=await sb.rpc('staff_list');
  if(error){view.innerHTML='<div class="panel"><h2>Can’t reach the time clock</h2><p class="sub" style="margin:0">'+esc(errMsg(error))+'. Check your internet connection and refresh.</p></div>';return}
  ST.list=data||[];
  const r=remembered();ST.emp=ST.list.find(e=>e.id===r)?r:null;
  ST.emp?pinScreen():pickScreen();
}
function pickScreen(){
  view.innerHTML=`<div class="stack"><div><h2>Who’s clocking in?</h2><p class="sub">Tap your name. This phone will remember you next time.</p></div>
  <div class="people">${ST.list.map(e=>`<button class="person" data-id="${e.id}"><b>${esc(e.name)}</b></button>`).join('')||'<p class="muted">No staff added yet. Your manager adds people under Manager login → Staff.</p>'}</div></div>`;
  view.querySelectorAll('.person').forEach(b=>b.onclick=()=>{ST.emp=b.dataset.id;remember(ST.emp);pinScreen()});
}
function pinScreen(){
  const e=ST.list.find(x=>x.id===ST.emp);
  view.innerHTML=`<div class="panel" style="max-width:440px"><h2>Hi ${esc(e.name.split(' ')[0])}</h2><p class="sub">Enter your PIN.</p>
  <form id="pinf" class="row"><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" style="font:500 24px var(--f-mono);width:140px;letter-spacing:.3em" aria-label="PIN"><button class="btn">Continue</button></form>
  <p id="pinerr" style="margin:8px 0 0;color:var(--red)"></p><button class="linkbtn" id="notme" style="margin-top:6px">Not ${esc(e.name.split(' ')[0])}? Pick another name</button></div>`;
  $('#pin').focus();
  $('#notme').onclick=()=>{remember(null);ST.emp=null;pickScreen()};
  $('#pinf').onsubmit=async ev=>{ev.preventDefault();ST.pin=$('#pin').value;const ok=await loadStatus();if(ok)clockScreen();else{$('#pin').value='';$('#pin').focus()}};
}
async function loadStatus(){
  const {data,error}=await sb.rpc('staff_status',{p_emp:ST.emp,p_pin:ST.pin});
  const msg=error?errMsg(error):data&&data.error;
  if(msg){const el=$('#pinerr');if(el)el.textContent=msg;else toast(msg,true);return false}
  ST.status=data;ST.skew=new Date(data.now).getTime()-Date.now();return true;
}
function bumpIdle(){clearTimeout(ST.idle);ST.idle=setTimeout(()=>{if(mode==='staff'&&ST.pin){toast('Signed out after 3 minutes');staffStart()}},180000)}

async function punch(a,btn){

function attest(){
  const sh=ST.status.open, now=new Date(serverNow()).toISOString();
  const meals=mealsOf(sh), w=mins(sh.clock_in,now)-meals.reduce((a,m)=>a+mins(m[0],m[1]),0);
  const needMeal=w>300, rn=restNeeded(w), issues=[];
  if(needMeal&&meals.length){const d=mins(meals[0][0],meals[0][1]);if(d<30)issues.push('Your lunch today was '+d+' minutes. It needs to be at least 30.');if(mins(sh.clock_in,meals[0][0])>300)issues.push('Your lunch started after your 5th hour of work.')}
  if(needMeal&&!meals.length&&(w>360||!ST.status.meal_waiver))issues.push('No lunch was clocked today.');
  const names=['morning','afternoon','evening','late'], items=[];
  if(needMeal&&meals.length)items.push({k:'meal',t:'I took my full 30-minute lunch break'});
  if(needMeal&&!meals.length&&w<=360&&ST.status.meal_waiver)items.push({k:'waive',t:'I chose to skip lunch today'});
  for(let i=0;i<rn;i++)items.push({k:'rest'+i,t:rn===1?'I took my 10-minute break':'I took my '+names[i]+' 10-minute break'});
  items.push({k:'acc',t:'My clock-in and clock-out times for today are accurate'});
  layer.innerHTML=`<div class="overlay"><form class="modal" id="att"><h2>You worked ${hrs(w)} hours today</h2>
  ${issues.length?`<div class="note warn" style="margin-top:10px">${issues.map(esc).join('<br>')}<br>Your manager will be notified.</div>`:''}
  ${rn===0?`<p class="muted" style="margin:8px 0 0;font-size:14px">No 10-minute breaks are required for shifts under 3.5 hours.</p>`:''}
  <div class="opts" style="margin-top:14px">${items.map(it=>`<label class="opt"><input type="checkbox" name="${it.k}" ${it.k==='waive'?'':'checked'}><span>${it.t}</span></label>`).join('')}</div>
  <div id="msgbox" ${issues.length?'':'hidden'} style="margin-top:14px"><label class="f" for="att-msg">Message to your manager</label>
  <textarea id="att-msg" style="min-height:80px;margin-top:4px" placeholder="Anything your manager should know? (optional)"></textarea></div>
  <div class="row" style="margin-top:16px"><button class="btn terra" id="att-go">Clock out</button><button type="button" class="btn ghost" id="cancel">Cancel</button><button type="button" class="btn ghost small" id="addmsg" ${issues.length?'hidden':''}>Add a note for my manager</button></div></form></div>`;
  const form=$('#att'),box=$('#msgbox');
  form.addEventListener('change',()=>{const missed=items.some(it=>it.k!=='waive'&&!form.elements[it.k].checked);if(missed){box.hidden=false;$('#addmsg').hidden=true}
    const off=!form.elements.acc.checked;$('#att-msg').required=off;$('#att-msg').placeholder=off?'What’s wrong with today’s times? (required)':'Anything your manager should know? (optional)'});
  $('#addmsg').onclick=()=>{box.hidden=false;$('#addmsg').hidden=true;$('#att-msg').focus()};
  $('#cancel').onclick=()=>layer.innerHTML='';
  form.onsubmit=async ev=>{ev.preventDefault();const el=form.elements;$('#att-go').disabled=true;
    const mealAns=!needMeal?'n/a':el.meal?(el.meal.checked?'yes':'no'):el.waive&&el.waive.checked?'waived':'no';
    const restAns=rn?([...Array(rn).keys()].every(i=>el['rest'+i].checked)?'yes':'no'):'n/a';
    const unchecked=items.filter(it=>it.k!=='waive'&&!el[it.k].checked).map(it=>it.k==='acc'?'Times are not accurate':it.t.replace(/^I took/,'Did not take'));
    const {data,error}=await sb.rpc('staff_clock_out',{p_emp:ST.emp,p_pin:ST.pin,p_meal_answer:mealAns,p_rest_answer:restAns,p_accurate:el.acc.checked,p_items:[...issues,...unchecked],p_message:$('#att-msg').value});
    const m=error?errMsg(error):data.error;if(m){$('#att-go').disabled=false;return toast(m,true)}
    layer.innerHTML='';const told=issues.length||unchecked.length||$('#att-msg').value.trim();
    toast(told?'Clocked out. Your manager was notified.':'Clocked out. Have a good evening.');
    setTimeout(staffStart,1500)};
}

  return `<section class="panel"><div class="emp-head"><div><h3>${esc(e.name)}</h3><span class="muted" style="font-size:13px">${esc(e.role)}${e.role?' · ':''}${e.full_time?'Full-time':'Part-time'}${e.active?'':' · inactive'}</span></div>
  <div class="totals mono"><span>${hrs(w)} hrs</span>${pay.ot?`<span>OT ${hrs(pay.ot)}</span>`:''}${pay.dt?`<span>DT ${hrs(pay.dt)}</span>`:''}${sick?`<span>Sick ${sick}</span>`:''}${vac?`<span>Vacation ${vac}</span>`:''}${mp?`<span class="p">Meal prem ${mp}</span>`:''}${rp?`<span class="p">Rest prem ${rp}</span>`:''}<button class="btn small ghost" data-add="${e.id}">Add missed shift</button></div></div>
  ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>In</th><th>Lunch</th><th>Out</th><th>Hours</th><th>Full lunch?</th><th>10-min breaks?</th><th>Flags</th></tr></thead><tbody>${trs}</tbody></table></div>`:'<p class="muted" style="margin:0">No shifts this period.</p>'}</section>`;
}
function editShift(id){
  const sh=M.shifts.find(s=>s.id===id),e=empById(sh.employee_id);
  const tf=['clock_in','meal1_start','meal1_end','meal2_start','meal2_end','clock_out'];
  layer.innerHTML=`<div class="overlay"><form class="modal" id="ed"><h2>Edit ${esc(e.name.split(' ')[0])}’s shift</h2><p class="sub">${dlabel(sh.work_date)}. The original times stay in the change log.</p>
  <div class="grid2">${tf.map(k=>`<label class="f">${FIELD[k]}<input type="time" id="e-${k}" value="${laHM(sh[k])}"></label>`).join('')}
  <label class="f">Full lunch?<select id="e-meal_answer"><option value="">No answer</option>${['yes','no','waived','n/a'].map(x=>`<option ${sh.meal_answer===x?'selected':''}>${x}</option>`).join('')}</select></label>
  <label class="f">10-min breaks?<select id="e-rest_answer"><option value="">No answer</option>${['yes','no','n/a'].map(x=>`<option ${sh.rest_answer===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
  <label class="f" style="margin-top:12px">Reason for change (required)<input id="e-r" required placeholder="e.g. Confirmed with employee, forgot to clock out"></label>
  <p class="note" style="margin:12px 0 0">If you change a break answer, confirm it with the employee first and say so in the reason.</p>
  <div class="row" style="margin-top:16px"><button class="btn">Save change</button><button type="button" class="btn ghost" id="cancel">Cancel</button></div></form></div>`;
  $('#cancel').onclick=()=>layer.innerHTML='';
  $('#ed').onsubmit=async ev=>{ev.preventDefault();const ch={};
    tf.forEach(k=>{const v=$('#e-'+k).value;if(v!==laHM(sh[k]))ch[k]=v?laToISO(sh.work_date,v):null});
    ['meal_answer','rest_answer'].forEach(k=>{const v=$('#e-'+k).value;if(v!==(sh[k]||''))ch[k]=v||null});
    if(!Object.keys(ch).length){layer.innerHTML='';return toast('Nothing changed')}
    const r=await call('manager_edit_shift',{p_shift:id,p_changes:ch,p_reason:$('#e-r').value});
    if(r){layer.innerHTML='';toast('Saved. '+r.changes+' change'+(r.changes>1?'s':'')+' logged')}};
}
function addShift(empId){
  const e=empById(empId);
  layer.innerHTML=`<div class="overlay"><form class="modal" id="as"><h2>Add a missed shift for ${esc(e.name.split(' ')[0])}</h2><p class="sub">For a day they forgot to clock in at all.</p>
  <div class="grid2"><label class="f">Date<input type="date" id="as-d" value="${todayLA()}" required></label><span></span>
  <label class="f">Clock in<input type="time" id="as-in" required></label><label class="f">Clock out<input type="time" id="as-out" required></label>
  <label class="f">Lunch start<input type="time" id="as-ms"></label><label class="f">Lunch end<input type="time" id="as-me"></label>
  <label class="f">Full lunch?<select id="as-ma"><option value="">No answer</option><option>yes</option><option>no</option><option>waived</option></select></label>
  <label class="f">10-min breaks?<select id="as-ra"><option value="">No answer</option><option>yes</option><option>no</option></select></label></div>
  <label class="f" style="margin-top:12px">Reason (required)<input id="as-r" required placeholder="e.g. Forgot to clock in, times confirmed with employee"></label>
  <div class="row" style="margin-top:16px"><button class="btn">Add shift</button><button type="button" class="btn ghost" id="cancel">Cancel</button></div></form></div>`;
  $('#cancel').onclick=()=>layer.innerHTML='';
  $('#as').onsubmit=async ev=>{ev.preventDefault();const r=await call('manager_add_shift',{p_emp:empId,p_date:$('#as-d').value,p_in:$('#as-in').value,p_out:$('#as-out').value,p_meal_start:$('#as-ms').value,p_meal_end:$('#as-me').value,p_meal_answer:$('#as-ma').value,p_rest_answer:$('#as-ra').value,p_reason:$('#as-r').value},'Shift added and logged');if(r)layer.innerHTML=''};
}
function csvRow(a){return a.map(x=>{x=String(x??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',')}
function csvDetail(P){
  const out=[csvRow(['Employee','Date','Clock In','Lunch Start','Lunch End','2nd Lunch Start','2nd Lunch End','Clock Out','Shift Hours','Day Regular Hrs','Day OT Hrs','Day DT Hrs','Full Lunch Answer','Rest Break Answer','Meal Premium Hrs','Rest Premium Hrs','Edited','Flags'])];
  const rows=M.shifts.filter(s=>s.work_date>=P.start&&s.work_date<=P.end).sort((a,b)=>empById(a.employee_id).name.localeCompare(empById(b.employee_id).name)||a.clock_in.localeCompare(b.clock_in));
  rows.forEach((s,i)=>{const R=evalM(s),next=rows[i+1],lastOfDay=!next||next.employee_id!==s.employee_id||next.work_date!==s.work_date;
    const d=lastOfDay?(M.pay[s.employee_id]||{})[s.work_date]:null;
    out.push(csvRow([empById(s.employee_id).name,s.work_date,laHM(s.clock_in),laHM(s.meal1_start),laHM(s.meal1_end),laHM(s.meal2_start),laHM(s.meal2_end),s.clock_out?laHM(s.clock_out):'MISSING',R.worked!=null?hrs(R.worked):'',d?hrs(d.reg):'',d?hrs(d.ot):'',d?hrs(d.dt):'',s.meal_answer||'no answer',s.rest_answer||'no answer',R.mealPrem,R.restPrem,s.edited?'yes':'no',R.flags.map(f=>f.t+(f.why?' ('+f.why+')':'')).join('; ')]))});
  return out.join('\n');
}
function csvSummary(P){
  const out=['Pay period '+P.start+' to '+P.end,csvRow(['Employee','Regular Hrs','OT Hrs (1.5x)','DT Hrs (2x)','Meal Premium Hrs','Rest Premium Hrs','Sick Hrs Used','Vacation Hrs Used','Sick Balance','Vacation Balance','Missing Clock-outs'])];
  M.emps.forEach(e=>{const sh=M.shifts.filter(s=>s.employee_id===e.id&&s.work_date>=P.start&&s.work_date<=P.end);
    const lv=M.leave.filter(l=>!l.voided&&l.employee_id===e.id&&l.leave_date>=P.start&&l.leave_date<=P.end);
    if(!sh.length&&!lv.length)return;let mp=0,rp=0,miss=0;const pay=periodPay(e.id,P),b=balances(e);
    sh.forEach(s=>{const R=evalM(s);mp+=R.mealPrem;rp+=R.restPrem;if(!s.clock_out)miss++});
    out.push(csvRow([e.name,hrs(pay.reg),hrs(pay.ot),hrs(pay.dt),mp,rp,lv.filter(l=>l.kind==='sick').reduce((a,l)=>a+ +l.hours,0),lv.filter(l=>l.kind==='vacation').reduce((a,l)=>a+ +l.hours,0),b.sickBal.toFixed(2),e.full_time?b.vacBal.toFixed(2):'',miss]))});
  out.push('','Overtime: over 8 hrs a day or 40 hrs a week = 1.5x; over 12 hrs a day = 2x; 7th day in a row in a workweek = 1.5x for the first 8 hrs, 2x after.',
    'Premiums are paid at each employee’s regular rate of pay and listed as a separate line on the pay stub. Please show the sick balance on each pay stub.');
  return out.join('\n');
}

/* ---- staff setup ---- */
function mStaff(){
  view.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2>Staff</h2><p class="sub" style="margin:0">Add each hourly employee with their own PIN. Starting balances come from PayEntry.</p></div><button class="btn" id="addemp">Add employee</button></div>
  <div class="panel" style="padding:0"><div class="tbl-wrap" style="border:0"><table><thead><tr><th>Name</th><th>Role</th><th>Type</th><th>Started on app</th><th>Status</th><th></th></tr></thead><tbody>
  ${M.emps.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.role)}</td><td>${e.full_time?'Full-time':'Part-time'}</td><td>${dlabel(e.start_date)}</td><td>${e.active?'<span class="pill ok">Active</span>':'<span class="pill yellow">Inactive</span>'}</td><td><button class="btn small ghost" data-edit="${e.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No staff yet.</td></tr>'}
  </tbody></table></div></div>
  <p class="note">To remove someone who left, edit them and turn off <b>Active</b>. Their records stay, which California requires for at least 3 years.</p></div>`;
  $('#addemp').onclick=()=>empForm(null);
  view.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>empForm(b.dataset.edit));
}
function empForm(id){
  const e=id?M.emps.find(x=>x.id===id):{name:'',role:'',full_time:false,active:true,meal_waiver:false,start_date:todayLA(),sick_balance_start:0,sick_used_year_start:0,vac_balance_start:0};
  layer.innerHTML=`<div class="overlay"><form class="modal" id="ef"><h2>${id?'Edit '+esc(e.name):'Add employee'}</h2>
  <div class="grid2" style="margin-top:12px"><label class="f">Name<input id="ef-n" value="${esc(e.name)}" required></label><label class="f">Role<input id="ef-r" value="${esc(e.role)}" placeholder="e.g. Vet assistant"></label>
  <label class="f">${id?'New PIN (leave blank to keep)':'PIN (4 to 6 digits)'}<input id="ef-p" inputmode="numeric" pattern="[0-9]{4,6}" ${id?'':'required'} autocomplete="off"></label>
  <label class="f">Start date on this app<input type="date" id="ef-s" value="${e.start_date}" required></label>
  <label class="chk"><input type="checkbox" id="ef-ft" ${e.full_time?'checked':''}> Full-time</label><label class="chk"><input type="checkbox" id="ef-a" ${e.active?'checked':''}> Active</label>
  <label class="chk" style="grid-column:1/-1"><input type="checkbox" id="ef-mw" ${e.meal_waiver?'checked':''}> Signed meal waiver on file (lets them skip lunch on shifts of 6 hours or less)</label></div>
  <h3 style="margin-top:18px">Starting balances from PayEntry</h3><p class="sub" style="margin:2px 0 10px">As of the start date above.</p>
  <div class="grid2"><label class="f">Sick hours available<input type="number" step="0.01" min="0" id="ef-sb" value="${e.sick_balance_start}"></label>
  <label class="f">Sick hours already used this year<input type="number" step="0.01" min="0" id="ef-su" value="${e.sick_used_year_start}"></label>
  <label class="f">Vacation hours available<input type="number" step="0.01" min="0" id="ef-vb" value="${e.vac_balance_start}"></label></div>
  <div class="row" style="margin-top:16px"><button class="btn">${id?'Save':'Add employee'}</button><button type="button" class="btn ghost" id="cancel">Cancel</button></div></form></div>`;
  $('#cancel').onclick=()=>layer.innerHTML='';
  $('#ef').onsubmit=async ev=>{ev.preventDefault();
    const r=await call('manager_save_employee',{p_id:id,p_name:$('#ef-n').value,p_role:$('#ef-r').value,p_full_time:$('#ef-ft').checked,p_pin:$('#ef-p').value||null,p_active:$('#ef-a').checked,p_start_date:$('#ef-s').value,p_sick_balance_start:+$('#ef-sb').value||0,p_sick_used_year_start:+$('#ef-su').value||0,p_vac_balance_start:+$('#ef-vb').value||0,p_meal_waiver:$('#ef-mw').checked},id?'Saved':'Employee added');
    if(r)layer.innerHTML=''};
}

/* ---- sick & vacation ---- */
function balances(e){
  const t=todayLA(),yr=t.slice(0,4);
  const mine=M.shifts.filter(s=>s.employee_id===e.id&&s.work_date>=e.start_date);
  const hoursApp=mine.reduce((a,s)=>a+(evaluate(s).worked||0),0)/60;
  const lv=M.leave.filter(l=>!l.voided&&l.employee_id===e.id&&l.leave_date>=e.start_date);
  const sickApp=lv.filter(l=>l.kind==='sick').reduce((a,l)=>a+ +l.hours,0);
  const sickYear=(e.start_date.slice(0,4)===yr?+e.sick_used_year_start:0)+lv.filter(l=>l.kind==='sick'&&l.leave_date.startsWith(yr)).reduce((a,l)=>a+ +l.hours,0);
  const earned=hoursApp/30, sickBal=Math.max(0,Math.min(SICK_CAP,+e.sick_balance_start+earned-sickApp));
  const vacEarned=e.full_time?VAC_PER_YEAR*Math.max(0,daysBetween(e.start_date,t))/365:0;
  const vacUsed=lv.filter(l=>l.kind==='vacation').reduce((a,l)=>a+ +l.hours,0);
  return {hoursApp,earned,sickYear,sickBal,vacEarned,vacUsed,vacBal:+e.vac_balance_start+vacEarned-vacUsed};
}
function mLeave(){
  const act=M.emps.filter(e=>e.active);
  view.innerHTML=`<div class="stack"><div><h2>Sick and vacation</h2><p class="sub">Sick time builds at 1 hour for every 30 hours worked, stops growing at ${SICK_CAP} hours, and each person can use up to ${SICK_USE_CAP} hours a year. Vacation is for full-time staff: ${VAC_PER_YEAR} hours a year, earned a little each day.</p></div>
  <div class="panel" style="padding:0"><div class="tbl-wrap" style="border:0"><table><thead><tr><th>Employee</th><th>Hours on app</th><th>Sick earned on app</th><th>Sick used this year</th><th>Sick balance</th><th>Vacation earned</th><th>Vacation used</th><th>Vacation balance</th></tr></thead><tbody>
  ${act.map(e=>{const b=balances(e);return `<tr><td><b>${esc(e.name)}</b><div class="muted" style="font-size:12.5px">since ${dlabel(e.start_date)}</div></td><td class="t">${b.hoursApp.toFixed(1)}</td><td class="t">${b.earned.toFixed(2)}</td><td class="t">${b.sickYear} <span class="muted">of ${SICK_USE_CAP}</span></td><td class="t"><b>${b.sickBal.toFixed(2)}</b>${b.sickBal>=SICK_CAP?' <span class="pill yellow">At cap</span>':''}</td><td class="t">${e.full_time?b.vacEarned.toFixed(2):'—'}</td><td class="t">${e.full_time?b.vacUsed:'—'}</td><td class="t">${e.full_time?'<b>'+b.vacBal.toFixed(2)+'</b>':'—'}</td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No staff yet.</td></tr>'}
  </tbody></table></div></div>
  <div class="panel"><h3>Record time off</h3><form id="lvf" class="grid4" style="margin-top:10px"><label class="f">Employee<select id="lv-e">${act.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label>
  <label class="f">Date<input type="date" id="lv-d" value="${todayLA()}" required></label><label class="f">Type<select id="lv-t"><option value="sick">Sick</option><option value="vacation">Vacation</option></select></label>
  <label class="f">Hours<input type="number" id="lv-h" min="0.25" step="0.25" value="8" required></label><label class="f" style="grid-column:1/-1">Note (optional)<input id="lv-n"></label>
  <div style="grid-column:1/-1" class="row"><button class="btn small" ${act.length?'':'disabled'}>Add</button><span id="lv-msg" style="font-size:13px;color:var(--red)"></span></div></form>
  <div style="margin-top:14px">${M.leave.filter(l=>!l.voided).slice().reverse().slice(0,40).map(l=>`<div class="req"><span>${esc(empById(l.employee_id).name)} · ${dlabel(l.leave_date)}${l.note?' · '+esc(l.note):''}</span><span class="row"><span class="mono">${l.kind==='sick'?'Sick':'Vacation'} ${+l.hours} hrs</span><button class="btn small ghost" data-void="${l.id}">Remove</button></span></div>`).join('')||'<p class="muted">No time off recorded yet.</p>'}</div></div></div>`;
  $('#lvf').onsubmit=async ev=>{ev.preventDefault();const e=empById($('#lv-e').value),t=$('#lv-t').value,h=+$('#lv-h').value,b=balances(e),msg=$('#lv-msg');
    if(t==='vacation'&&!e.full_time)return msg.textContent=e.name.split(' ')[0]+' is part-time and doesn’t earn vacation.';
    if(t==='sick'&&h>b.sickBal+0.001)return msg.textContent='Only '+b.sickBal.toFixed(2)+' sick hours available.';
    if(t==='sick'&&b.sickYear+h>SICK_USE_CAP)return msg.textContent='That would go over the '+SICK_USE_CAP+'-hour yearly limit.';
    if(t==='vacation'&&h>b.vacBal+0.001)return msg.textContent='Only '+b.vacBal.toFixed(2)+' vacation hours available.';
    await call('manager_add_leave',{p_emp:e.id,p_date:$('#lv-d').value,p_kind:t,p_hours:h,p_note:$('#lv-n').value},'Time off recorded')};
  view.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>{
    layer.innerHTML=`<div class="overlay"><form class="modal" id="vf"><h2>Remove this time off?</h2><p class="sub">It stays in the change log.</p><label class="f">Reason (required)<input id="vf-r" required placeholder="e.g. Entered the wrong date"></label><div class="row" style="margin-top:16px"><button class="btn">Remove</button><button type="button" class="btn ghost" id="cancel">Cancel</button></div></form></div>`;
    $('#cancel').onclick=()=>layer.innerHTML='';
    $('#vf').onsubmit=async ev=>{ev.preventDefault();const r=await call('manager_void_leave',{p_id:b.dataset.void,p_reason:$('#vf-r').value},'Removed and logged');if(r)layer.innerHTML=''}});
}

/* ---- change log ---- */
function mLog(){
  const rows=M.audit.slice().reverse();
  const val=(a,which)=>{if(a.field==='Employee details'){try{const o=JSON.parse(a.old_value),n=JSON.parse(a.new_value);const k=Object.keys(n).filter(x=>JSON.stringify(o[x])!==JSON.stringify(n[x]));return k.map(x=>x.replace(/_/g,' ')+': '+(which==='old'?o[x]:n[x])).join(', ')}catch(e){}}return which==='old'?a.old_value:a.new_value};
  view.innerHTML=`<div class="stack"><div><h2>Change log</h2><p class="sub">Every change to a punch, break answer, employee or time off, with the original value, who changed it and why. Nothing here can be edited or deleted.</p></div>
  <div class="panel" style="padding:0"><div class="tbl-wrap" style="border:0"><table><thead><tr><th>When</th><th>Changed by</th><th>Employee</th><th>Shift</th><th>What</th><th>From</th><th>To</th><th>Reason</th></tr></thead><tbody>
  ${rows.map(a=>{const sh=M.shifts.find(s=>s.id===a.shift_id);return `<tr><td class="t">${laDate(new Date(a.at))} ${fmtT(a.at)}</td><td>${esc(a.actor)}</td><td>${esc(a.employee_id?empById(a.employee_id).name:'')}</td><td>${sh?dlabel(sh.work_date):''}</td><td>${esc(FIELD[a.field]||a.field)}</td><td>${esc(val(a,'old')??'')}</td><td>${esc(val(a,'new')??'')}</td><td>${esc(a.reason)}</td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No changes yet.</td></tr>'}
  </tbody></table></div></div></div>`;
}

start();
})();
</script>
